[project]
name = "goku-instant-transmission"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Royverse", email = "roymootsana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.2.0",
    "numpy>=2.5.4",
